name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy

  test:
    name: test (${{ matrix.os }}, ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12"]
        include:
          - os: ubuntu-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: pytest

  supply-chain:
    name: supply chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install uv==0.13.9 pip-audit==2.10.1 cyclonedx-bom==9.0.0
      # The lockfile must match pyproject.toml. uv keeps the pins it finds, so only a change to
      # pyproject.toml makes this differ; then rebuild it with the command in the file's header.
      - run: |
          uv pip compile pyproject.toml --extra mcp --generate-hashes --universal \
            --python-version 3.12 -o requirements.lock
          git diff --exit-code requirements.lock
      - run: pip-audit -r requirements.lock --require-hashes --disable-pip
      - run: cyclonedx-py requirements requirements.lock --of JSON -o sbom.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom.cdx.json

  cedar-oracle:
    name: cedar oracle
    runs-on: ubuntu-latest
    env:
      CEDAR_ORACLE_REQUIRED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      # The official Cedar command line tool, at the engine version cedarpy 4.12 is built on.
      - run: cargo install cedar-policy-cli --version 4.12.0 --locked
      - run: python -m pip install -e ".[dev]"
      - run: pytest tests/test_cedar_oracle.py -q

  licences:
    name: licence check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      # Runtime dependencies only, in a clean environment: these are what Ritvo distributes.
      - run: |
          python -m venv /tmp/lic
          /tmp/lic/bin/pip install . pip-licenses==5.5.5
          /tmp/lic/bin/pip-licenses --from=mixed --format=markdown
          # Two named exceptions, each approved by the maintainer. cedarpy declares no licence in
          # its metadata; its repository and the LICENSE file in its wheel are Apache-2.0 (checked
          # 2026-11-23). certifi (CA certificates, pulled in by httpx) is MPL-2.0, used unmodified.
          /tmp/lic/bin/pip-licenses --from=mixed --partial-match \
            --ignore-packages cedarpy certifi \
            --allow-only="MIT;BSD;Apache;ISC;PSF;Python Software Foundation"

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "/tmp/${archive}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  /tmp/${archive}" | sha256sum --check
          tar -xzf "/tmp/${archive}" -C /tmp gitleaks
      - name: Scan history
        run: /tmp/gitleaks git --config .gitleaks.toml --redact --verbose .

  install:
    name: wheel and pipx install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        id: python
        with:
          python-version: "3.12"
      - run: python -m pip install build==1.6.1
      - run: python -m build --wheel
      - name: Install with pipx and run
        env:
          PYTHON_PATH: ${{ steps.python.outputs.python-path }}
        run: |
          pipx install --python "$PYTHON_PATH" dist/*.whl
          "$(pipx environment --value PIPX_BIN_DIR)/ritvo" --version
