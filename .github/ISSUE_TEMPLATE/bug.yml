name: Bug report
description: Something does not behave as the spec or the docs say it should.
labels: [needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Do not paste real credentials, tokens, client configuration or client data. Use fictional values.
        Security problems go through private vulnerability reporting, not here.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The smallest set of steps, commands or files (fictional data only) that shows the problem.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Output of `ritvo --version`, or the commit you built from.
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Linux, macOS, Windows]
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
  - type: input
    id: spec
    attributes:
      label: Spec reference
      description: The section of docs/SPEC.md that describes the expected behaviour, if you know it.
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues.
          required: true
        - label: This report contains no real secrets, tokens or client data.
          required: true
