name: Feature request
description: Propose a new capability or a change to the spec.
labels: [needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Please check the non-goals in the README first. Ritvo does not rebuild what gateways sell
        (key issuance, budgets, provider proxying, tool allow lists), and does not do credential custody
        or TLS interception.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Who needs this, and what can they not do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should Ritvo do? Describe behaviour, not implementation.
    validations:
      required: true
  - type: input
    id: spec
    attributes:
      label: Spec reference
      description: The section of docs/SPEC.md this would change or add to.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues.
          required: true
        - label: This is not one of the non-goals listed in the README.
          required: true
