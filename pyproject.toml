[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ritvo"
dynamic = ["version"]
description = "An open-source authority layer for AI agents: who may approve what, how decisions escalate, and the evidence."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12"
authors = [{ name = "Sunil Kalkunte", email = "11992509+sunilkalkunte@users.noreply.github.com" }]
keywords = ["ai-agents", "mcp", "authorization", "governance", "approvals", "audit"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Typing :: Typed",
]
dependencies = [
  "typer>=0.20",
]

[project.optional-dependencies]
dev = [
  "mypy>=2.3",
  "pytest>=9.0",
  "ruff==0.16.9",
]

[project.scripts]
ritvo = "ritvo.cli.main:app"

[project.urls]
Homepage = "https://ritvo.ai"
Source = "https://github.com/ritvo-ai/ritvo"
Issues = "https://github.com/ritvo-ai/ritvo/issues"
Changelog = "https://github.com/ritvo-ai/ritvo/blob/main/CHANGELOG.md"
Security = "https://github.com/ritvo-ai/ritvo/security/policy"

[tool.hatch.version]
path = "ritvo/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["ritvo"]

[tool.hatch.build.targets.sdist]
include = [
  "ritvo",
  "tests",
  "docs",
  ".github/scripts/check_attribution.py",
  "LICENSE",
  "NOTICE",
  "README.md",
  "CHANGELOG.md",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "PTH", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["ritvo", "tests", ".github/scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
